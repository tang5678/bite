<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唐唐-用户管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0b0d; --surface: #111318; --surface2: #181c24; --border: #252c3a; 
    --accent: #f0a500; --text: #e8ecf4; --text3: #4a5568; --danger: #ff4757; 
    --success: #2ed573; --warning: #ffa502; --unused: #a78bfa;
    --success: #2ed573; /* 绿色 */
  }
/* 统计卡片中“有效”数字改为绿色 */
.stat-card .stat-value[style*="color:var(--active)"] {
    color: var(--success) !important;
}
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'JetBrains Mono', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 80px; overflow-y: scroll; }
  
  .header { position:sticky; top:0; z-index:100; background: rgba(10,11,13,0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 10px 20px; display:flex; align-items:center; justify-content:space-between; }
  .logo { font-family:'Syne',sans-serif; font-weight:800; color: var(--accent); font-size: 1.2rem; }
  .sync-info { font-size: 10px; color: var(--text3); margin-left: 10px; }

  .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #000; padding: 8px 20px; border-radius: 4px; font-weight: bold; font-size: 12px; z-index: 9999; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); }
  .toast.show { opacity: 1; transform: translate(-50%, 10px); }

  .stats-bar { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; padding: 20px; width: 98%; max-width: 1600px; margin:0 auto; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px; cursor:pointer; transition: 0.2s; }
  .stat-card.active { border: 2px solid var(--accent); background: var(--surface2); }
  .stat-label { font-size:10px; color:var(--text3); }
  .stat-value { font-family:'Syne',sans-serif; font-size:18px; font-weight: 800; }

  .unused-container { width: 98%; max-width: 1600px; margin: 0 auto 20px auto; padding: 0 20px; }
  .unused-box { background: rgba(167, 139, 250, 0.05); border: 1px dashed var(--unused); border-radius: 8px; padding: 12px; }
  .unused-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .unused-item { background: var(--surface2); border: 1px solid var(--border); padding: 3px 8px; border-radius: 4px; font-size: 11px; display: flex; align-items: center; gap: 6px; }

  .main-content { width: 98%; max-width: 1600px; margin:0 auto; padding:0 20px; }
  .table-wrap { background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow-x: auto; }
  table { width:100%; border-collapse:collapse; min-width: 1100px; table-layout: fixed; }
  th { background:var(--surface2); color:var(--text3); font-size:11px; padding:12px 10px; text-align:left; border-bottom:1px solid var(--border); }
  
  td { padding:10px; font-size:13px; border-bottom:1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-stat { color: var(--accent); font-weight: 800; margin-left: 4px; }
  .editable { cursor: pointer; border-bottom: 1px dashed #444; position: relative; }
  .editable:hover { background: rgba(240,165,0,0.05); color: var(--accent); }
  
  .edit-input { background: #000; border: 1px solid var(--accent); color: #fff; width: 100%; padding: 4px; border-radius: 4px; font-family: inherit; outline: none; }
  .col-filter { width: 100%; background: #000; border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 10px; padding: 3px; margin-top: 5px; box-sizing: border-box; }
  
  .btn { padding: 6px 12px; border-radius:4px; border:none; cursor:pointer; font-size:11px; font-weight:600; display:inline-flex; align-items:center; justify-content: center; gap:4px; }
  .btn-sm { padding: 4px 8px; font-size: 10px; }
  .btn-success { background:var(--success); color:#000; }
  .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  
  .star-btn { cursor: pointer; font-size: 16px; color: var(--text3); transition: 0.2s; margin-right: 5px; vertical-align: middle; }
  .star-btn.active { color: var(--warning); text-shadow: 0 0 8px rgba(255,165,2,0.5); }

  .trash-drawer { position: fixed; right: -500px; top: 0; width: 500px; max-width: 95vw; height: 100%; background: var(--surface); border-left: 1px solid var(--border); transition: 0.3s; z-index: 101; padding: 20px; box-shadow: -10px 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; }
  .trash-drawer.open { right: 0; }
  .trash-list-wrap { flex: 1; overflow-y: auto; margin-top: 10px; }
  .trash-row { display: grid; grid-template-columns: 1.5fr 1fr 1fr 0.8fr; align-items: center; background: var(--surface2); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 11px; gap: 8px; }
  .trash-header { display: grid; grid-template-columns: 1.5fr 1fr 1fr 0.8fr; padding: 0 12px 8px 12px; color: var(--text3); font-size: 10px; gap: 8px; }
  
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 100; backdrop-filter: blur(2px); }
  .overlay.open { display: block; }
  .loading-mask { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9999; display: none; align-items: center; justify-content: center; color: var(--accent); font-weight: bold; }
</style>
</head>
<body>

<div class="toast" id="toastMsg">已复制</div>
<div class="loading-mask" id="loadingMask">☁️ Supabase 同步中...</div>

<header class="header">
  <div style="display:flex; align-items:center">
    <div class="logo">⚡ 唐唐-用户管理系统</div>
    <span class="sync-info" id="syncStatus">连接中...</span>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn btn-ghost" onclick="syncFromCloud()">🔄 强制刷新</button>
    <button class="btn btn-ghost" onclick="toggleTrash(true)">🗑️ 回收站 (<span id="trashCount">0</span>)</button>
  </div>
</header>

<div class="stats-bar" id="statsBar"></div>

<div class="unused-container">
  <div class="unused-box">
    <div style="font-size: 11px; color: var(--unused); font-weight: bold;">🔑 待激活名额</div>
    <div class="unused-list" id="unusedGrid"></div>
  </div>
</div>

<main class="main-content">
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th width="40"></th>
          <th width="90">归属</th>
          <th width="70">窗口 <span class="header-stat" id="statWindows">/ 0</span><input type="text" class="col-filter" data-col="windows" oninput="render()"></th>
          <th width="140">用户 <span class="header-stat" id="statUsers">/ 0</span><input type="text" class="col-filter" data-col="username" oninput="render()"></th>
          <th width="110">密码<input type="text" class="col-filter" data-col="password" oninput="render()"></th>
          <th width="100">微信<input type="text" class="col-filter" data-col="wechat" oninput="render()"></th>
          <th width="115">激活时间<input type="text" class="col-filter" data-col="activeTime" oninput="render()"></th>
          <th width="115">到期日期<input type="text" class="col-filter" data-col="expiry" oninput="render()"></th>
          <th width="70">金额 <span class="header-stat" id="statAmount">/ 0</span><input type="text" class="col-filter" data-col="amount" oninput="render()"></th>
          <th width="80">状态</th>
          <th width="100">操作</th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>
</main>

<div class="overlay" id="overlay" onclick="toggleTrash(false)"></div>
<div class="trash-drawer" id="trashDrawer">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px">
    <h3 style="color:var(--danger)">🗑️ 回收站 (仅供查看)</h3>
    <button class="btn btn-ghost" onclick="toggleTrash(false)">关闭</button>
  </div>
  <div class="trash-header">
    <div>用户名</div><div>微信</div><div>到期(月日)</div><div>金额</div>
  </div>
  <div class="trash-list-wrap" id="trashList"></div>
</div>

<script>
const SUPABASE_URL = 'https://xlmnfzocrlqvbzzrdshr.supabase.co'; 
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsbW5mem9jcmxxdmJ6enJkc2hyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODMyMjAsImV4cCI6MjA5MDU1OTIyMH0.Pvhl7JTz-FmOZ6J_aT8kBRve3ZrjOIIVVekr4jTZXUM';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STORAGE_KEY = 'uf_v45_db';
const ROW_ID = 1; 

const DEFAULT_WINDOWS = '100';
const DEFAULT_AMOUNT = '32';
const DEFAULT_PWD = '123456';
const TARGET_ORG = '唐唐';

let db = { users: [], unused: [], trash: [] };
let currentFilter = 'all';
let newlyActivatedId = null;
let _isSaving = false;      // 保存锁，防止并发覆盖
let _saveTimer = null;      // 防抖定时器
let _hasPendingSave = false;// 是否有尚未提交的本地修改
let baseSnapshot = null;
let lastKnownUpdatedAt = null; // 【乐观锁】云端最后的时间戳版本

function getBeijingTime() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    return new Date(utc + (3600000 * 8));
}

function getStatus(dateStr) {
    if (!dateStr || dateStr === '-') return 'expired';
    const targetDate = new Date(dateStr);
    targetDate.setHours(0, 0, 0, 0);
    const today = getBeijingTime();
    today.setHours(0, 0, 0, 0);
    const diffDays = Math.ceil((targetDate - today) / 86400000);
    if (diffDays < 0) return 'expired';
    if (diffDays <= 3) return 'expiring';
    return 'active';
}

async function syncFromCloud(silent = false) {
    // 如果正在保存或者本地刚做了修改还在排队，一律跳过拉取，防止云端旧数据覆盖正在处理的表单！
    if (_isSaving || _hasPendingSave) {
        console.log('[sync] 正在保存或排队保存中，跳过此次同步');
        return;
    }
    if (silent && document.querySelector('.edit-input')) {
        return;
    }
    if (!silent) showLoading(true);
    try {
        const { data, error } = await supabaseClient.from('MainData').select('content, updated_at').eq('id', ROW_ID).single();
        if (error) throw error;
        
        if (_isSaving || _hasPendingSave) {
            console.log('[sync] 请求期间发生本地修改，抛弃本次返回版本');
            if (!silent) showLoading(false);
            return;
        }

        if (data && data.content) {
            lastKnownUpdatedAt = data.updated_at || 'FRESH';
            // 兼容 content 可能是字符串或对象
            let parsed = data.content;
            if (typeof parsed === 'string') {
                try { parsed = JSON.parse(parsed); } catch(e) { parsed = {}; }
            }
            db = { users: [], unused: [], trash: [], ...parsed };
            baseSnapshot = JSON.parse(JSON.stringify(db)); // 更新合并基准点
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            render();
            const timeStr = getBeijingTime().toLocaleTimeString('zh-CN', {hour12:false});
            document.getElementById('syncStatus').innerText = `✅ 已同步 ${timeStr}`;
        }
    } catch (err) {
        console.error('[sync] 同步失败:', err);
        // 同步失败时尝试从 localStorage 恢复
        const local = localStorage.getItem(STORAGE_KEY);
        if (local) {
            try { db = { users: [], unused: [], trash: [], ...JSON.parse(local) }; render(); } catch(e) {}
        }
        document.getElementById('syncStatus').innerText = `❌ 同步失败`;
    }
    if (!silent) showLoading(false);
}

// 防抖保存：多次快速编辑只触发一次上传
function saveToCloud() {
    _hasPendingSave = true; // 标记本地有新修改
    // 立即保存到 localStorage（防止页面关闭丢数据）
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ users: db.users, unused: db.unused, trash: db.trash }));
    document.getElementById('syncStatus').innerText = "☁️ 等待上传...";
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(() => _doSaveToCloud(), 500);
}

async function _doSaveToCloud() {
    if (_isSaving) {
        // 如果正在保存，延迟重试
        clearTimeout(_saveTimer);
        _saveTimer = setTimeout(() => _doSaveToCloud(), 600);
        return;
    }
    _hasPendingSave = false; // 进入实际保存过程
    _isSaving = true;
    const statusEl = document.getElementById('syncStatus');
    statusEl.innerText = "☁️ 正在上传...";

    if (!lastKnownUpdatedAt) {
        alert("⚠️ 启动保护拒绝保存：\n您尚未成功获取过云端版本号。为防止意外覆盖他人的存档网络数据，请先点击【🔄 强制刷新】后再尝试进行操作！");
        statusEl.innerText = "❌ 警告: 缺少初始同步验证";
        _isSaving = false;
        return;
    }

    // 保存为对象（不是 JSON 字符串），让 Supabase jsonb 正确存储
    const payload = { users: db.users, unused: db.unused, trash: db.trash };
    const currentNow = new Date().toISOString();
    try {
        let opResult;
        if (lastKnownUpdatedAt === 'FRESH') {
            opResult = await supabaseClient.from('MainData').upsert({ id: ROW_ID, content: payload, updated_at: currentNow }).select();
        } else {
            opResult = await supabaseClient.from('MainData')
                .update({ content: payload, updated_at: currentNow })
                .eq('id', ROW_ID)
                .eq('updated_at', lastKnownUpdatedAt)
                .select();
        }

        if (opResult.error) throw opResult.error;

        if (lastKnownUpdatedAt !== 'FRESH' && (!opResult.data || opResult.data.length === 0)) {
            console.log("[save] 并发冲突，启动三向合并自愈机制");
            _isSaving = false;
            statusEl.innerHTML = `<span style="color:var(--warning); font-weight:bold;">☁️ 冲突解决中，自动合并...</span>`;
            setTimeout(() => autoResolveConflict(), 0);
            return;
        }

        lastKnownUpdatedAt = currentNow;
        const timeStr = getBeijingTime().toLocaleTimeString('zh-CN', {hour12:false});
        statusEl.innerText = `✅ 已同步 ${timeStr}`;
    } catch (err) {
        console.error('[save] 上传失败:', err);
        statusEl.innerText = "⚠️ 仅本地保存";
    } finally {
        _isSaving = false;
    }
}

async function autoResolveConflict() {
    showLoading(true);
    let latestData = null;
    let latestUpdatedAt = null;
    try {
        const { data, error } = await supabaseClient.from('MainData').select('content, updated_at').eq('id', ROW_ID).single();
        if (error) throw error;
        if (data && data.content) {
            latestUpdatedAt = data.updated_at;
            let parsed = data.content;
            if (typeof parsed === 'string') { try { parsed = JSON.parse(parsed); } catch(e) { parsed = {}; } }
            latestData = { users: [], unused: [], trash: [], ...parsed };
        }
    } catch (err) {
        console.error("抓取最新数据合并失败", err);
        showLoading(false);
        alert("网络异常导致合并失败，请手动强制刷新！");
        return;
    }

    if (!baseSnapshot || !latestData) {
        console.warn("无有效基线快照，强制重载...");
        syncFromCloud(false);
        return;
    }

    const localData = { users: db.users, unused: db.unused, trash: db.trash };

    function isEqualItem(a, b) {
        if (!a && !b) return true;
        if (!a || !b) return false;
        const ka = Object.keys(a), kb = Object.keys(b);
        if (ka.length !== kb.length) return false;
        for (let k of ka) if (a[k] !== b[k]) return false;
        return true;
    }

    let hasActivationClash = false;

    function globallyMerge(baseObj, localObj, remoteObj) {
        function extractMap(dbObj) {
            const m = new Map();
            ['users','unused','trash'].forEach(listName => {
                for (let item of dbObj[listName] || []) {
                    m.set(item.id, { list: listName, data: item });
                }
            });
            return m;
        }

        const baseMap = extractMap(baseObj);
        const localMap = extractMap(localObj);
        const remoteMap = extractMap(remoteObj);
        const allIds = new Set([...baseMap.keys(), ...localMap.keys(), ...remoteMap.keys()]);
        const finalIds = new Map();

        for (let id of allIds) {
            const baseInfo = baseMap.get(id);
            const localInfo = localMap.get(id);
            const remoteInfo = remoteMap.get(id);

            const isLocalSame = isEqualItem(localInfo?.data, baseInfo?.data) && localInfo?.list === baseInfo?.list;
            const isRemoteSame = isEqualItem(remoteInfo?.data, baseInfo?.data) && remoteInfo?.list === baseInfo?.list;

            if (isLocalSame) {
                if (remoteInfo) finalIds.set(id, remoteInfo);
            } else if (isRemoteSame) {
                if (localInfo) finalIds.set(id, localInfo);
            } else {
                if (baseInfo?.list === 'unused' && localInfo?.list === 'users' && remoteInfo?.list === 'users') {
                    hasActivationClash = true;
                    if (remoteInfo) finalIds.set(id, remoteInfo);
                } else {
                    if (localInfo) finalIds.set(id, localInfo);
                }
            }
        }

        const newDb = { users: [], unused: [], trash: [] };
        ['users','unused','trash'].forEach(listName => {
            const added = new Set();
            for (let item of localObj[listName] || []) {
                const finalInfo = finalIds.get(item.id);
                if (finalInfo && finalInfo.list === listName) {
                    newDb[listName].push(finalInfo.data);
                    added.add(item.id);
                }
            }
            for (let item of remoteObj[listName] || []) {
                const finalInfo = finalIds.get(item.id);
                if (finalInfo && finalInfo.list === listName && !added.has(item.id)) {
                    newDb[listName].push(finalInfo.data);
                }
            }
        });
        return newDb;
    }

    const mergedDb = globallyMerge(baseSnapshot, localData, latestData);

    if (hasActivationClash) {
        alert("⚠️ 手慢无提示！\n\n您刚刚尝试激活的名额，已被其他同事抢先一步激活！\n为防止生成重复记录，您本次的激活操作已被拦截取消。\n\n系统已自动为您重新拉取最新的名额分配状态。");
        showLoading(false);
        document.getElementById('syncStatus').innerHTML = `<span style="color:var(--danger); font-weight:bold;">❌ 激活手慢冲突</span>`;
        db.users = latestData.users;
        db.unused = latestData.unused;
        db.trash = latestData.trash;
        baseSnapshot = JSON.parse(JSON.stringify(db));
        lastKnownUpdatedAt = latestUpdatedAt;
        render();
        return;
    }

    db.users = mergedDb.users;
    db.unused = mergedDb.unused;
    db.trash = mergedDb.trash;
    
    baseSnapshot = JSON.parse(JSON.stringify(db));
    lastKnownUpdatedAt = latestUpdatedAt;
    
    setTimeout(() => {
        _hasPendingSave = true;
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ users: db.users, unused: db.unused, trash: db.trash }));
        _doSaveToCloud();
    }, 50);

    render();
    showLoading(false);
    
    document.getElementById('syncStatus').innerHTML = `<span style="color:var(--success); font-weight:bold;">✅ 已自动合并更改</span>`;
}

function render() {
    const container = document.getElementById('userTableBody');
    let displayData = db.users.filter(u => (u.owner || '').includes(TARGET_ORG));
    
    const filters = {};
    document.querySelectorAll('.col-filter').forEach(i => { if(i.value) filters[i.dataset.col] = i.value.toLowerCase(); });

    displayData = displayData.filter(u => {
        const statusMatch = currentFilter === 'all' || getStatus(u.expiry) === currentFilter;
        const columnMatch = Object.keys(filters).every(key => String(u[key] || '-').toLowerCase().includes(filters[key]));
        return statusMatch && columnMatch;
    });

    displayData.sort((a,b) => {
        if (a.isStarred && !b.isStarred) return -1;
        if (!a.isStarred && b.isStarred) return 1;
        if (a.id === newlyActivatedId) return -1;
        if (b.id === newlyActivatedId) return 1;
        return new Date(a.expiry) - new Date(b.expiry);
    });

    document.getElementById('statWindows').innerText = `/ ${displayData.reduce((s, u) => s + parseInt(u.windows || 0), 0)}`;
    document.getElementById('statUsers').innerText = `/ ${displayData.length}`;
    document.getElementById('statAmount').innerText = `/ ${displayData.reduce((s, u) => s + parseFloat(u.amount || 0), 0).toFixed(0)}`;
    document.getElementById('trashCount').innerText = db.trash.filter(u => (u.owner || '').includes(TARGET_ORG)).length;

    renderStatsBar();
    renderUnusedGrid();

    container.innerHTML = '';
    displayData.forEach(u => {
        const tr = document.createElement('tr');
        const st = getStatus(u.expiry);
        tr.innerHTML = `
            <td><span class="star-btn ${u.isStarred?'active':''}" onclick="toggleStar('${u.id}')">★</span></td>
            <td>${u.owner || '-'}</td>
            <td data-f="windows">${u.windows || DEFAULT_WINDOWS}</td>
            <td data-f="username"><b>${u.username}</b></td>
            <td data-f="password">${u.password || DEFAULT_PWD}</td>
            <td data-f="wechat">${u.wechat||'-'}</td>
            <td>${u.activeTime || '-'}</td>
            <td>${u.expiry}</td>
            <td style="color:var(--accent)">${u.amount || DEFAULT_AMOUNT}</td>
            <td><span style="color:var(--${st}); font-size:10px; font-weight:bold">${st==='expiring'?'⚠️到期':st==='active'?'✅有效':'❌过期'}</span></td>
            <td>
                <button class="btn btn-success btn-sm" onclick="quickRenew('${u.id}')">续费</button>
                <button class="btn btn-danger btn-sm" onclick="moveToTrash('${u.id}')">删除</button>
            </td>
        `;

        tr.querySelectorAll('td').forEach(td => {
            let timer = null;
            td.onclick = () => { clearTimeout(timer); timer = setTimeout(() => copyToClipboard(td.innerText.replace('★','')), 250); };
            
            if(['windows', 'wechat', 'password'].includes(td.dataset.f)) {
                td.classList.add('editable');
                td.ondblclick = () => { clearTimeout(timer); makeEditable(td, u.id, td.dataset.f); };
            }
        });
        container.appendChild(tr);
    });
}

function moveToTrash(id) {
    if(!confirm("确定移至回收站？")) return;
    const idx = db.users.findIndex(u => u.id === id);
    if(idx > -1) {
        db.trash.unshift(db.users.splice(idx, 1)[0]);
        saveToCloud(); render();
    }
}

function renderTrash() {
    const list = document.getElementById('trashList');
    const orgTrash = db.trash.filter(u => (u.owner || '').includes(TARGET_ORG));
    list.innerHTML = orgTrash.map(u => `
        <div class="trash-row">
            <div style="overflow:hidden; text-overflow:ellipsis"><b>${u.username}</b></div>
            <div>${u.wechat || '-'}</div>
            <div style="color:var(--accent)">${(u.expiry||'').slice(5)}</div>
            <div>¥${u.amount || '0'}</div>
        </div>
    `).join('') || '<div style="text-align:center; padding:40px; color:var(--text3)">空</div>';
}

function toggleStar(id) { const u = db.users.find(x => x.id === id); if(u) { u.isStarred = !u.isStarred; saveToCloud(); render(); } }

function activate(id) {
    const u = db.unused.find(x => x.id === id);
    if(!u) return;
    const now = getBeijingTime();
    const activeTime = now.toISOString().slice(0,10);
    now.setMonth(now.getMonth() + 1);
    newlyActivatedId = id;
    db.users.push({ 
        id: id, 
        username: u.username, 
        password: u.password, 
        owner: TARGET_ORG, 
        wechat: '-', 
        amount: DEFAULT_AMOUNT, 
        windows: DEFAULT_WINDOWS, 
        activeTime, 
        expiry: now.toISOString().slice(0,10), 
        isStarred: false 
    });
    db.unused = db.unused.filter(x => x.id !== id);
    saveToCloud(); render();
}

function quickRenew(id) {
    const u = db.users.find(x => x.id === id);
    if (!u) return;
    let d = new Date(u.expiry);
    if (d < getBeijingTime()) d = getBeijingTime();
    d.setDate(d.getDate() + 30);
    u.expiry = d.toISOString().slice(0, 10);
    saveToCloud(); render();
}

function renderStatsBar() {
    const orgUsers = db.users.filter(u => (u.owner || '').includes(TARGET_ORG));
    const s = { 
        all: orgUsers.length, 
        active: orgUsers.filter(u => getStatus(u.expiry) === 'active').length, 
        expiring: orgUsers.filter(u => getStatus(u.expiry) === 'expiring').length, 
        expired: orgUsers.filter(u => getStatus(u.expiry) === 'expired').length, 
        unused: db.unused.length 
    };
    const labels = { all:'总用户', active:'有效', expiring:'待续', expired:'过期', unused:'名额' };
    
    document.getElementById('statsBar').innerHTML = Object.keys(labels).map(k => {
        // 将 active 的颜色指向 success (绿色)
        let colorVar = k;
        if (k === 'all') colorVar = 'accent';
        if (k === 'active') colorVar = 'success'; 
        
        return `
            <div class="stat-card ${currentFilter===k?'active':''}" onclick="currentFilter='${k}';render()">
                <div class="stat-label">${labels[k]}</div>
                <div class="stat-value" style="color:var(--${colorVar})">${s[k]}</div>
            </div>`;
    }).join('');
}

function renderUnusedGrid() {
    document.getElementById('unusedGrid').innerHTML = db.unused.map(u => `
        <div class="unused-item">
            <span>${u.username}</span>
            <button class="btn" 
                    style="height:18px; font-size:9px; background-color: #2ed573; color: #000000; border: none; font-weight: bold;" 
                    onclick="activate('${u.id}')">激活</button>
        </div>
    `).join('');
}

function makeEditable(el, id, field) {
    const oldVal = el.innerText === '-' ? '' : el.innerText;
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = oldVal;
    el.innerHTML = ''; el.appendChild(input); input.focus();
    input.onblur = () => {
      if (input._saved) return; // 防止重复触发
      input._saved = true;
      const u = db.users.find(x => x.id === id);
      if(u) {
        u[field] = input.value.trim() || '-';
        saveToCloud();
      }
      render();
    };
    input.onkeydown = (e) => { if(e.key==='Enter') input.blur(); };
}

function toggleTrash(s) { document.getElementById('trashDrawer').classList.toggle('open',s); document.getElementById('overlay').classList.toggle('open',s); if(s) renderTrash(); }
function copyToClipboard(text) { if (!text || text === '-') return; const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); document.getElementById('toastMsg').classList.add('show'); setTimeout(() => document.getElementById('toastMsg').classList.remove('show'), 1500); }
function showLoading(s) { document.getElementById('loadingMask').style.display = s ? 'flex' : 'none'; }

// 页面加载：先从 localStorage 快速恢复，再从云端同步
(function initLoad() {
    const local = localStorage.getItem(STORAGE_KEY);
    if (local) {
        try {
            db = { users: [], unused: [], trash: [], ...JSON.parse(local) };
            render();
        } catch(e) {}
    }
    syncFromCloud();
})();

// 页面关闭前确保数据保存
window.addEventListener('beforeunload', () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ users: db.users, unused: db.unused, trash: db.trash }));
});
setInterval(() => syncFromCloud(true), 5000);
</script>
</body>
</html>
